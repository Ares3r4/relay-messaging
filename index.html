<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Test Client</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
      background: #0a0f12;
      color: #e8f1ee;
      --bg: #0a0f12;
      --bg-soft: #121a1d;
      --panel: #161f23;
      --panel-alt: #1b272b;
      --border: #2a393d;
      --muted: #9bb0a7;
      --text: #edf7f3;
      --primary: #4ec18d;
      --primary-strong: #2fb37a;
      --secondary: #23343a;
      --notice: #d4a24a;
      --info: #6aa5d8;
      --danger: #f26a6a;
      --shadow: rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      background: radial-gradient(circle at top, #132026 0%, #0a0f12 45%, #070b0d 100%);
      color: var(--text);
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    header { margin-bottom: 28px; }

    .eyebrow {
      margin: 0 0 8px;
      color: #7ae0b4;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.1;
    }

    header p:last-child {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 18px 45px var(--shadow);
    }

    .connection, .composer {
      display: flex;
      align-items: end;
      gap: 10px;
      padding: 18px;
    }

    .connection { border-bottom: 1px solid var(--border); }

    .field { flex: 1; min-width: 0; }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-alt);
      color: var(--text);
      font: inherit;
    }

    input::placeholder { color: #7a8d88; }
    input:focus { outline: 2px solid rgba(78, 193, 141, 0.7); outline-offset: 1px; }

    button {
      min-height: 42px;
      padding: 0 15px;
      border: 0;
      border-radius: 6px;
      background: var(--primary);
      color: #08140f;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button.secondary {
      border: 1px solid var(--border);
      background: var(--secondary);
      color: var(--text);
    }
    button.secondary:hover { background: #2b3b40; }

    .log-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }

    .log-heading h2 { margin: 0; font-size: 14px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7d8d88;
      content: "";
    }

    .status.connected { color: #9bf0c7; }
    .status.connected::before { background: var(--primary); }
    .status.error { color: #ff9d9d; }
    .status.error::before { background: var(--danger); }

    #messages {
      display: flex;
      height: min(48vh, 380px);
      min-height: 220px;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding: 16px 18px;
      background: #0d1417;
    }

    .entry {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 11px;
      border-left: 3px solid #4c5c60;
      background: #141d21;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      animation: arrive .18s ease-out;
      border-radius: 0 6px 6px 0;
    }

    .entry.sent { border-color: var(--primary); }
    .entry.received { border-color: var(--info); }
    .entry.notice { border-color: var(--notice); }
    .time { color: #7f9691; font-variant-numeric: tabular-nums; }
    .empty { margin: auto; color: #8ea29b; font-size: 13px; }

    .composer { border-top: 1px solid var(--border); }
    .composer .field { flex: 1; min-width: 0; }
    .composer input { flex: 1; min-width: 0; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 26px 14px; }
      .connection { align-items: stretch; flex-direction: column; }
      .connection button { width: 100%; }
      .composer { padding: 12px; }
      .composer input { font-size: 14px; }
      .composer button { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Local development tool</p>
      <h1>WebSocket Test Client</h1>
      <p>Connect to your server, send a message, and watch the broadcast arrive.</p>
    </header>

    <section class="panel" aria-label="WebSocket client">
      <form class="connection" id="connection-form">
        <div class="field">
          <label for="url">WebSocket URL</label>
          <input id="url" type="url" value="ws://localhost:8080" spellcheck="false" required>
        </div>
        <button id="connect-button" type="submit">Connect</button>
        <button id="disconnect-button" class="secondary" type="button" disabled>Disconnect</button>
      </form>

      <div class="log-heading">
        <h2>Message log</h2>
        <span id="status" class="status" role="status">Disconnected</span>
      </div>
      <div id="messages" role="log" aria-live="polite" aria-relevant="additions">
        <p class="empty" id="empty-state">Messages will appear here.</p>
      </div>

      <form class="composer" id="message-form">
        <div class="field">
          <label for="sender-name">Your name</label>
          <input id="sender-name" type="text" value="Guest" maxlength="50" autocomplete="off" aria-label="Your name" disabled>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <input id="message" type="text" placeholder="Write a message..." autocomplete="off" aria-label="Message" disabled>
        </div>
        <button id="send-button" type="submit" disabled>Send</button>
        <button id="clear-button" class="secondary" type="button" title="Clear message log">Clear</button>
      </form>
    </section>
  </main>

  <script>
    const connectionForm = document.querySelector('#connection-form');
    const messageForm = document.querySelector('#message-form');
    const urlInput = document.querySelector('#url');
    const connectButton = document.querySelector('#connect-button');
    const disconnectButton = document.querySelector('#disconnect-button');
    const senderNameInput = document.querySelector('#sender-name');
    const messageInput = document.querySelector('#message');
    const sendButton = document.querySelector('#send-button');
    const clearButton = document.querySelector('#clear-button');
    const status = document.querySelector('#status');
    const messages = document.querySelector('#messages');
    let socket;

    function setStatus(label, state = '') {
      status.textContent = label;
      status.className = `status ${state}`.trim();
    }

    function addEntry(kind, text) {
      document.querySelector('#empty-state')?.remove();
      const entry = document.createElement('div');
      entry.className = `entry ${kind}`;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = new Date().toLocaleTimeString();
      const content = document.createElement('span');
      content.textContent = text;
      entry.append(time, content);
      messages.append(entry);
      messages.scrollTop = messages.scrollHeight;
    }

    function formatMessageEntry(message) {
      const sender = message?.sender_name || 'anonymous';
      const content = message?.content || '';
      const happenedAt = message?.created_at ? new Date(message.created_at).toLocaleTimeString() : new Date().toLocaleTimeString();
      return `${sender} @ ${happenedAt}: ${content}`;
    }

    function handleServerMessage(event) {
      try {
        const payload = JSON.parse(String(event.data));

        if (payload?.type === 'history' && Array.isArray(payload.data)) {
          payload.data.forEach((message) => addEntry('received', formatMessageEntry(message)));
          return;
        }

        if (payload?.type === 'new_message' && payload.data) {
          addEntry('received', formatMessageEntry(payload.data));
          return;
        }
      } catch (error) {
        // Ignore parsing errors for plain-text messages and render as-is.
      }

      addEntry('received', String(event.data));
    }

    function updateControls(connected) {
      connectButton.disabled = connected;
      disconnectButton.disabled = !connected;
      urlInput.disabled = connected;
      senderNameInput.disabled = !connected;
      messageInput.disabled = !connected;
      sendButton.disabled = !connected;
      if (connected) messageInput.focus();
    }

    connectionForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (socket && socket.readyState < WebSocket.CLOSING) socket.close();

      try {
        socket = new WebSocket(urlInput.value.trim());
      } catch (error) {
        setStatus('Invalid URL', 'error');
        addEntry('notice', error.message);
        return;
      }

      setStatus('Connecting');
      socket.addEventListener('open', () => {
        setStatus('Connected', 'connected');
        updateControls(true);
        addEntry('notice', `Connected to ${urlInput.value.trim()}`);
      });
      socket.addEventListener('message', handleServerMessage);
      socket.addEventListener('error', () => {
        setStatus('Connection error', 'error');
        addEntry('notice', 'Could not connect. Check that the server is running.');
      });
      socket.addEventListener('close', (event) => {
        setStatus('Disconnected');
        updateControls(false);
        addEntry('notice', `Connection closed (code ${event.code})`);
      });
    });

    disconnectButton.addEventListener('click', () => socket?.close());

    messageForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      const senderName = (senderNameInput.value || 'anonymous').trim() || 'anonymous';

      if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

      socket.send(JSON.stringify({
        sender_name: senderName,
        content: text
      }));

      messageInput.value = '';
      messageInput.focus();
    });

    clearButton.addEventListener('click', () => {
      messages.replaceChildren();
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.id = 'empty-state';
      empty.textContent = 'Messages will appear here.';
      messages.append(empty);
    });
  </script>
</body>
</html>
